name: Build and release AutoSign

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install Windows build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nasm nsis
      - name: Build Windows installer
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: ./scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: autosign-windows-x64
          path: |
            dist/AutoSign-*-windows-x64-setup.exe
            dist/AutoSign-*-windows-x64-portable.exe
            dist/AutoSign-*-windows-x64-cli.exe
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build Apple Silicon DMG
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: autosign-macos-arm64
          path: dist/AutoSign-*-macos-arm64.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-x64, macos-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum AutoSign-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AutoSign ${GITHUB_REF_NAME#v}" \
            --generate-notes
