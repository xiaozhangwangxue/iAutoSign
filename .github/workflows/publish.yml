name: Publish existing AutoSign artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build workflow run ID
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        default: v2.8.0
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: autosign-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}

      - name: Validate release files and create checksums
        working-directory: release-assets
        run: |
          test -f AutoSign-2.8.0-macos-arm64.dmg
          test -f AutoSign-2.8.0-windows-x64-setup.exe
          test -f AutoSign-2.8.0-windows-x64-portable.exe
          test -f AutoSign-2.8.0-windows-x64-cli.exe
          sha256sum AutoSign-* > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target main \
            --title "AutoSign 2.8.0" \
            --generate-notes
