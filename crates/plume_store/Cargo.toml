[package]
name = "plume_store"
description = "Data storage layer for Plume Impactor tools."
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `fs` is needed by the account store itself; enabling it here means the crate
# also compiles when it is built on its own (for example in tests) instead of
# relying on feature unification with the GUI application.
tokio = { workspace = true, features = ["fs"] }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
plume_core = { path = "../plume_core", features = ["tweaks"] }
