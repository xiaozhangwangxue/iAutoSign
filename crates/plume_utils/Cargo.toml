[package]
name = "plume_utils"
description = "Utility functions and types for Impactor tools."
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
idevice.workspace = true
thiserror.workspace = true
uuid.workspace = true
plist.workspace = true
tokio.workspace = true
futures.workspace = true
log.workspace = true
image.workspace = true
goblin.workspace = true
zip.workspace = true
flate2.workspace = true
plume_core = { path = "../plume_core", features = ["tweaks"] }
plume_store = { path = "../plume_store" }
decompress = { path = "../../3rdparty/decompress" }

[dev-dependencies]
# Used by the signing tests to synthesise a small Mach-O file.
apple-codesign = { path = "../../3rdparty/apple-platform-rs/apple-codesign", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
